  <g transform="translate(850 65) scale(.78)" fill="url(#gold-wave)">
    <path d="M0 4 C-12 -9 -12 -28 0 -44 C12 -28 12 -9 0 4 Z"/>
    <path d="M-8 9 C-29 -1 -34 -20 -29 -35 C-14 -27 -6 -12 -8 9 Z"/>
