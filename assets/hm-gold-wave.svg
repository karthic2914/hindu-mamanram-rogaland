    C989 49 1073 76 1182 78
    C1328 84 1442 54 1542 30
    C1605 15 1656 7 1710 -2
    L1710 8
    C1656 16 1606 24 1544 38
    C1441 63 1326 92 1180 84
    C1071 81 987 55 885 69 Z"/>
