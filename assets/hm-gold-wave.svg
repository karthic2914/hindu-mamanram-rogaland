<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="112" viewBox="0 0 1700 112" fill="none" role="img" aria-label="Decorative gold wave with lotus">
  <defs>
    <linearGradient id="gold-wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5B65C"/>
      <stop offset=".55" stop-color="#DCA347"/>
      <stop offset="1" stop-color="#E8BC6B"/>
    </linearGradient>
  </defs>
  <!-- Two independently tapered ribbons reproduce the reference's flowing wave.
       The upper/lower paths form filled shapes rather than a constant-width stroke. -->
  <path fill="url(#gold-wave)" d="M-10 61
    C100 20 195 59 310 75
    C425 91 520 77 636 62
    C722 51 774 55 815 65
    C774 59 721 57 636 68
    C520 84 423 99 308 82
    C190 65 95 29 -10 70 Z"/>
